server:
  port: 8080

spring:
  datasource:
    # Defaults target the host (local bootRun). In Docker, these are overridden via
    # environment so the app reaches MySQL by its compose service name on 3306.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/paymentdb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # Auto-creates tables (good for dev)
    show-sql: true       # Prints SQL in logs
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    org.hibernate.SQL: DEBUG
